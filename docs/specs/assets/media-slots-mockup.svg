<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Mockup dos espaços reservados para imagens do BASE</title>
  <desc id="desc">Quatro molduras abstratas mostram proporções para hero, história, profissional e atleta. Não há fotografias nem pessoas representadas.</desc>
  <defs>
    <pattern id="lines" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V34" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#082541"/>
      <stop offset="1" stop-color="#17466a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#d9e0e7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="28" fill="#f3f5f7"/>
  <text x="56" y="68" fill="#082541" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">BASE VÔLEI CLUB · MOCKUP DE MÍDIA</text>
  <text x="56" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="17">Áreas temporárias para substituir por imagens oficiais autorizadas</text>

  <g transform="translate(56 145)">
    <rect width="1088" height="360" rx="18" fill="url(#hero)"/>
    <rect width="1088" height="360" rx="18" fill="url(#lines)"/>
    <path d="M720 0v360M850 0v360M720 180h368" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="904" cy="180" r="92" fill="none" stroke="#d91627" stroke-width="3" stroke-opacity=".85"/>
    <circle cx="904" cy="180" r="66" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect x="28" y="28" width="132" height="32" rx="16" fill="#d91627"/>
    <text x="94" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HERO · 16:9</text>
    <text x="40" y="265" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Imagem de abertura</text>
    <text x="40" y="299" fill="#d7e1ec" font-family="Arial, sans-serif" font-size="17">Treino, orientação e convivência — foto ou poster oficial</text>
    <text x="1048" y="334" text-anchor="end" fill="#d7e1ec" font-family="Arial, sans-serif" font-size="12">Recorte mobile próprio quando houver mídia</text>
  </g>

  <g transform="translate(56 535)">
    <rect width="520" height="300" rx="18" fill="url(#paper)"/>
    <rect width="520" height="300" rx="18" fill="url(#lines)"/>
    <path d="M0 226h520" stroke="#082541" stroke-opacity=".2" stroke-width="2"/>
    <rect x="24" y="22" width="146" height="30" rx="15" fill="#082541"/>
    <text x="97" y="42" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HISTÓRIA · 3:2</text>
    <text x="28" y="266" fill="#082541" font-family="Arial, sans-serif" font-size="18" font-weight="700">Registro do projeto</text>
    <text x="28" y="287" fill="#475569" font-family="Arial, sans-serif" font-size="13">Foto horizontal opcional</text>
  </g>

  <g transform="translate(600 535)">
    <rect width="260" height="300" rx="18" fill="url(#paper)"/>
    <rect width="260" height="300" rx="18" fill="url(#lines)"/>
    <rect x="18" y="18" width="132" height="30" rx="15" fill="#082541"/>
    <text x="84" y="38" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8">PROFISSIONAL · 4:5</text>
    <text x="18" y="258" fill="#082541" font-family="Arial, sans-serif" font-size="16" font-weight="700">Retrato autorizado</text>
    <text x="18" y="280" fill="#475569" font-family="Arial, sans-serif" font-size="12">Placeholder abstrato</text>
  </g>

  <g transform="translate(884 535)">
    <rect width="260" height="300" rx="18" fill="url(#paper)"/>
    <rect width="260" height="300" rx="18" fill="url(#lines)"/>
    <rect x="18" y="18" width="98" height="30" rx="15" fill="#d91627"/>
    <text x="67" y="38" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8">ATLETA · 4:5</text>
    <text x="18" y="258" fill="#082541" font-family="Arial, sans-serif" font-size="16" font-weight="700">Retrato autorizado</text>
    <text x="18" y="280" fill="#475569" font-family="Arial, sans-serif" font-size="12">Placeholder abstrato</text>
  </g>
</svg>
